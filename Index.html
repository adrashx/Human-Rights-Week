<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRA - Human Rights Week Celebration</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (to compile JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts for that "Human" feel -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #FDFBF7; /* Warm paper color */
        }
        h1, h2, h3, h4, h5, .font-serif {
            font-family: 'DM Serif Display', serif;
        }
        
        /* Custom Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #d6d3d1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a29e;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- ICONS (Inline SVGs for portability) ---
        const Icons = {
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
            MapPin: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>,
            PenTool: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>,
            Image: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>,
            Mic: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>,
            ChevronRight: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="9 18 15 12 9 6"></polyline></svg>,
            CheckCircle: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
            AlertCircle: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            Sparkles: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
            Heart: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>,
            Phone: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>,
            Mail: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>,
            Star: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        };

        // --- APP LOGIC ---

        const { useState, useEffect } = React;

        // PASTE YOUR GOOGLE SCRIPT URL HERE
        const SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE"; 

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            // Events Data
            const events = [
                {
                    id: 'poster',
                    title: 'Poster Making',
                    subtitle: 'Art for Rights',
                    date: '13th Jan',
                    time: '9:00 AM - 10:30 AM',
                    venue: 'Classroom 405',
                    IconComp: Icons.PenTool,
                    iconColor: 'text-emerald-600',
                    color: 'bg-emerald-50 border-emerald-100',
                    btnColor: 'bg-emerald-600 hover:bg-emerald-700',
                    description: 'Canvas is your voice. Express your vision of human rights through art. Bring your own supplies and creativity!',
                    note: null
                },
                {
                    id: 'stories',
                    title: 'Stories Through Lens',
                    subtitle: 'Photography Contest',
                    date: '13th Jan',
                    time: '12:00 PM Onwards',
                    venue: 'Classroom 501',
                    IconComp: Icons.Image,
                    iconColor: 'text-rose-600',
                    color: 'bg-rose-50 border-rose-100',
                    btnColor: 'bg-rose-600 hover:bg-rose-700',
                    description: 'Capture the untold stories. A photography & storytelling competition where your lens speaks for those who cannot.',
                    note: 'Submit by 12th Jan, 10:00 AM'
                },
                {
                    id: 'openmic',
                    title: 'Open Mic',
                    subtitle: 'Speak Your Truth',
                    date: '14th Jan',
                    time: '12:00 PM Onwards',
                    venue: 'Classroom 501',
                    IconComp: Icons.Mic,
                    iconColor: 'text-amber-600',
                    color: 'bg-amber-50 border-amber-100',
                    btnColor: 'bg-amber-600 hover:bg-amber-700',
                    description: 'The stage is yours. Sing, speak, dance, or recite poetry. Let your performance echo the call for justice.',
                    note: null
                }
            ];

            // Form Logic
            const [formData, setFormData] = useState({ name: '', classStr: '', event: '', email: '', phone: '' });
            const [queue, setQueue] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [showSuccessModal, setShowSuccessModal] = useState(false);
            const [submitStatus, setSubmitStatus] = useState('idle');

            const isFormValid = formData.name.trim() !== '' && formData.classStr.trim() !== '' && formData.event !== '' && formData.email.trim() !== '' && formData.phone.trim() !== '';

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const initiateSubmit = (e) => {
                e.preventDefault();
                if (isFormValid) setShowConfirmModal(true);
            };

            const confirmSubmit = () => {
                setShowConfirmModal(false);
                const timestamp = new Date().toISOString();
                setQueue(prev => [...prev, { ...formData, timestamp }]);
            };

            // Queue Processor
            useEffect(() => {
                const processQueue = async () => {
                    if (queue.length > 0 && !isProcessing) {
                        setIsProcessing(true);
                        setSubmitStatus('sending');
                        const currentRequest = queue[0];

                        try {
                            if (SCRIPT_URL === "PASTE_YOUR_WEB_APP_URL_HERE") {
                                console.warn("Script URL not set. Simulating success.");
                                await new Promise(resolve => setTimeout(resolve, 1500));
                            } else {
                                await fetch(SCRIPT_URL, {
                                    method: 'POST',
                                    mode: 'no-cors',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(currentRequest)
                                });
                            }
                            setSubmitStatus('success');
                            setShowSuccessModal(true);
                            setFormData({ name: '', classStr: '', event: '', email: '', phone: '' });
                            setQueue(prev => prev.slice(1));
                        } catch (error) {
                            console.error("Submission error:", error);
                            setSubmitStatus('error');
                            setQueue(prev => prev.slice(1));
                        } finally {
                            setIsProcessing(false);
                        }
                    }
                };
                processQueue();
            }, [queue, isProcessing]);

            // Components
            const Modal = ({ isOpen, onClose, title, children, footer, colorClass }) => {
                if (!isOpen) return null;
                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900 bg-opacity-40 backdrop-blur-md p-4 animate-fade-in">
                        <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden">
                            <div className={`${colorClass} p-6 flex justify-between items-center relative overflow-hidden`}>
                                <div className="absolute top-0 right-0 w-20 h-20 bg-white opacity-10 rounded-full translate-x-1/3 -translate-y-1/3"></div>
                                <h3 className="text-white font-serif font-bold text-xl relative z-10">{title}</h3>
                                <button onClick={onClose} className="text-white/80 hover:text-white transition relative z-10"><Icons.X /></button>
                            </div>
                            <div className="p-8 text-stone-600">{children}</div>
                            {footer && <div className="bg-stone-50 p-6 flex justify-end gap-3 border-t border-stone-100">{footer}</div>}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen text-stone-800">
                    
                    {/* NAVBAR */}
                    <nav className="sticky top-4 z-40 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="bg-white/80 backdrop-blur-lg shadow-sm border border-stone-200/60 rounded-full px-6 py-3 flex justify-between items-center transition-all hover:shadow-md">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-full flex items-center justify-center text-white font-serif font-bold text-xl shadow-lg shadow-blue-200">C</div>
                                <div className="hidden sm:block">
                                    <h1 className="text-sm font-bold text-stone-800 leading-tight">Shankarrao Chavan Law College</h1>
                                    <p className="text-[10px] text-stone-500 font-medium tracking-widest uppercase">CHRA Human Rights Week</p>
                                </div>
                            </div>
                            <div className="hidden md:flex items-center space-x-2 bg-stone-100/50 p-1 rounded-full">
                                {['home', 'events'].map((tab) => (
                                    <button key={tab} onClick={() => setActiveTab(tab)} className={`px-6 py-2 rounded-full text-sm font-medium transition-all duration-300 ${activeTab === tab ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-500 hover:text-stone-800'}`}>
                                        {tab.charAt(0).toUpperCase() + tab.slice(1)}
                                    </button>
                                ))}
                                <button onClick={() => setActiveTab('register')} className={`px-6 py-2 rounded-full text-sm font-medium transition-all duration-300 ${activeTab === 'register' ? 'bg-rose-500 text-white shadow-md shadow-rose-200' : 'text-rose-600 hover:bg-rose-50'}`}>Register</button>
                            </div>
                            <div className="md:hidden">
                                <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="text-stone-600 p-2 hover:bg-stone-100 rounded-full transition"><Icons.Menu /></button>
                            </div>
                        </div>
                        {isMenuOpen && (
                            <div className="md:hidden absolute top-20 left-4 right-4 bg-white rounded-2xl shadow-xl border border-stone-100 p-2 space-y-1 z-50">
                                <button onClick={() => { setActiveTab('home'); setIsMenuOpen(false); }} className="block w-full text-left px-4 py-3 text-stone-700 font-medium hover:bg-stone-50 rounded-xl">Home</button>
                                <button onClick={() => { setActiveTab('events'); setIsMenuOpen(false); }} className="block w-full text-left px-4 py-3 text-stone-700 font-medium hover:bg-stone-50 rounded-xl">Events</button>
                                <button onClick={() => { setActiveTab('register'); setIsMenuOpen(false); }} className="block w-full text-left px-4 py-3 text-rose-600 font-bold bg-rose-50 rounded-xl">Register Now</button>
                            </div>
                        )}
                    </nav>

                    {/* MAIN CONTENT */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
                        
                        {/* HOME TAB */}
                        {activeTab === 'home' && (
                            <div className="space-y-16 animate-fade-in">
                                <div className="relative rounded-[2.5rem] overflow-hidden bg-[#2D3142] text-white shadow-2xl min-h-[500px] flex items-center">
                                    <div className="absolute top-[-20%] right-[-10%] w-[500px] h-[500px] bg-[#EF8354] rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
                                    <div className="absolute bottom-[-20%] left-[-10%] w-[400px] h-[400px] bg-[#4F5D75] rounded-full mix-blend-screen filter blur-3xl opacity-20"></div>
                                    <div className="relative z-10 w-full p-8 md:p-20 grid md:grid-cols-2 gap-12 items-center">
                                        <div className="space-y-8">
                                            <div className="inline-flex items-center gap-2 px-4 py-2 bg-white/10 backdrop-blur-sm rounded-full border border-white/20 text-orange-100 text-sm font-medium">
                                                <Icons.Sparkles /> 13th & 14th January 2026
                                            </div>
                                            <div>
                                                <h1 className="text-5xl md:text-7xl font-serif font-bold mb-4 leading-tight">Welfare of <br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-[#EF8354] to-[#FCA311]">Masses</span></h1>
                                                <p className="text-lg text-gray-300 max-w-md leading-relaxed">A celebration of humanity. Join us for two days of art, stories, and voices that matter.</p>
                                            </div>
                                            <div className="flex flex-wrap gap-4">
                                                <button onClick={() => setActiveTab('events')} className="bg-white text-[#2D3142] px-8 py-4 rounded-full font-bold hover:bg-orange-50 transition transform hover:-translate-y-1 shadow-lg shadow-white/10">Explore Events</button>
                                                <button onClick={() => setActiveTab('register')} className="bg-transparent border border-white/30 text-white px-8 py-4 rounded-full font-bold hover:bg-white/10 transition">Register Now</button>
                                            </div>
                                        </div>
                                        <div className="hidden md:grid grid-cols-2 gap-4 opacity-90">
                                            <div className="space-y-4 mt-8">
                                                <div className="bg-[#EF8354] p-6 rounded-3xl rounded-tl-[4rem] text-white h-40 flex flex-col justify-end animate-float">
                                                    <div className="mb-2"><Icons.PenTool /></div><span className="font-serif text-lg">Create</span>
                                                </div>
                                                <div className="bg-[#4F5D75] p-6 rounded-3xl text-white h-48 flex flex-col justify-end animate-float" style={{animationDelay: '1s'}}>
                                                    <div className="mb-2"><Icons.Mic /></div><span className="font-serif text-lg">Speak</span>
                                                </div>
                                            </div>
                                            <div className="space-y-4">
                                                <div className="bg-white/10 backdrop-blur-md p-6 rounded-3xl border border-white/10 text-white h-48 flex flex-col justify-end animate-float" style={{animationDelay: '2s'}}>
                                                    <div className="mb-2"><Icons.Image /></div><span className="font-serif text-lg">Capture</span>
                                                </div>
                                                <div className="bg-[#BFC0C0] p-6 rounded-3xl rounded-br-[4rem] text-[#2D3142] h-40 flex flex-col justify-end animate-float" style={{animationDelay: '3s'}}>
                                                    <div className="mb-2"><Icons.Heart /></div><span className="font-serif text-lg">Connect</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex flex-wrap justify-center gap-6 md:gap-12 text-stone-600">
                                    <div className="flex items-center gap-3 bg-white px-6 py-3 rounded-2xl shadow-sm border border-stone-100"><span className="text-orange-500"><Icons.Calendar /></span><span className="font-medium">Jan 13-14</span></div>
                                    <div className="flex items-center gap-3 bg-white px-6 py-3 rounded-2xl shadow-sm border border-stone-100"><span className="text-indigo-500"><Icons.MapPin /></span><span className="font-medium">Classroom 405 & 501</span></div>
                                    <div className="flex items-center gap-3 bg-white px-6 py-3 rounded-2xl shadow-sm border border-stone-100"><span className="text-yellow-500"><Icons.Star /></span><span className="font-medium">Open to All Students</span></div>
                                </div>
                            </div>
                        )}

                        {/* EVENTS TAB */}
                        {(activeTab === 'events' || activeTab === 'home') && (
                            <div className={`mt-20 ${activeTab === 'events' ? 'animate-fade-in' : ''}`}>
                                <div className="mb-12 text-center max-w-2xl mx-auto">
                                    <h2 className="text-4xl font-serif font-bold text-stone-900 mb-4">{activeTab === 'home' ? 'Highlights' : 'Event Schedule'}</h2>
                                    <p className="text-stone-500 text-lg leading-relaxed">Every voice matters. Whether you paint, speak, or capture moments, there's a space for you here.</p>
                                </div>
                                <div className="grid md:grid-cols-3 gap-8">
                                    {events.map((event) => (
                                        <div key={event.id} className={`group relative bg-white rounded-[2rem] border-2 ${event.color} p-2 hover:shadow-xl transition-all duration-500 hover:-translate-y-2`}>
                                            <div className="bg-white rounded-[1.5rem] h-full p-6 flex flex-col overflow-hidden relative">
                                                <div className="mb-6 flex justify-between items-start z-10">
                                                    <div>
                                                        <span className="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-stone-100 text-stone-600 mb-2">{event.date}</span>
                                                        <h3 className="text-2xl font-serif font-bold text-stone-900">{event.title}</h3>
                                                        <p className="text-stone-500 font-medium">{event.subtitle}</p>
                                                    </div>
                                                    <div className={`p-3 bg-stone-50 rounded-2xl group-hover:rotate-12 transition-transform duration-300 ${event.iconColor}`}>
                                                        <event.IconComp width={24} height={24} />
                                                    </div>
                                                </div>
                                                <div className="space-y-4 mb-8 flex-grow z-10">
                                                    <p className="text-stone-600 leading-relaxed">{event.description}</p>
                                                    <div className="flex flex-col gap-2 text-sm text-stone-500 bg-stone-50 p-4 rounded-xl">
                                                        <div className="flex items-center gap-2"><Icons.Clock /> {event.time}</div>
                                                        <div className="flex items-center gap-2"><Icons.MapPin /> {event.venue}</div>
                                                    </div>
                                                    {event.note && (
                                                        <div className="flex items-start gap-2 text-xs text-amber-700 bg-amber-50 p-3 rounded-xl">
                                                            <div className="mt-0.5"><Icons.AlertCircle /></div>
                                                            {event.note}
                                                        </div>
                                                    )}
                                                </div>
                                                <button onClick={() => { setFormData(prev => ({ ...prev, event: event.title })); setActiveTab('register'); window.scrollTo(0, 0); }} className={`w-full py-4 rounded-xl text-white font-bold shadow-md transition-all flex items-center justify-center gap-2 group/btn ${event.btnColor}`}>
                                                    Participate <span className="group-hover/btn:translate-x-1 transition-transform"><Icons.ChevronRight /></span>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* REGISTER TAB */}
                        {activeTab === 'register' && (
                            <div className="max-w-xl mx-auto mt-8 animate-fade-in relative">
                                <div className="absolute inset-0 bg-stone-200 transform rotate-2 rounded-[2rem] -z-10"></div>
                                <div className="bg-white rounded-[2rem] shadow-xl overflow-hidden border border-stone-100 p-8 md:p-12">
                                    <div className="text-center mb-10">
                                        <div className="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4"><Icons.PenTool size={28} /></div>
                                        <h2 className="text-3xl font-serif font-bold text-stone-900">Save Your Spot</h2>
                                        <p className="text-stone-500 mt-2">We can't wait to see what you bring to the table.</p>
                                    </div>
                                    <form onSubmit={initiateSubmit} className="space-y-6">
                                        <div className="space-y-5">
                                            <div className="relative">
                                                <label className="block text-xs font-bold uppercase tracking-wider text-stone-400 mb-1 ml-1">Which Event?</label>
                                                <select name="event" value={formData.event} onChange={handleInputChange} className="w-full px-6 py-4 bg-stone-50 rounded-2xl border-2 border-transparent focus:border-rose-300 focus:bg-white outline-none transition font-medium text-stone-800 appearance-none cursor-pointer">
                                                    <option value="">Select an activity...</option>
                                                    {events.map(e => <option key={e.id} value={e.title}>{e.title}</option>)}
                                                </select>
                                                <div className="absolute right-6 top-[2.4rem] text-stone-400 rotate-90 pointer-events-none"><Icons.ChevronRight /></div>
                                            </div>
                                            <div className="grid md:grid-cols-2 gap-5">
                                                <div><label className="block text-xs font-bold uppercase tracking-wider text-stone-400 mb-1 ml-1">Your Name</label><input type="text" name="name" value={formData.name} onChange={handleInputChange} placeholder="e.g. Aditi Sharma" className="w-full px-6 py-4 bg-stone-50 rounded-2xl border-2 border-transparent focus:border-blue-300 focus:bg-white outline-none transition font-medium" /></div>
                                                <div><label className="block text-xs font-bold uppercase tracking-wider text-stone-400 mb-1 ml-1">Class</label><input type="text" name="classStr" value={formData.classStr} onChange={handleInputChange} placeholder="e.g. LL.B II" className="w-full px-6 py-4 bg-stone-50 rounded-2xl border-2 border-transparent focus:border-blue-300 focus:bg-white outline-none transition font-medium" /></div>
                                            </div>
                                            <div className="grid md:grid-cols-2 gap-5">
                                                <div><label className="block text-xs font-bold uppercase tracking-wider text-stone-400 mb-1 ml-1">Email</label><input type="email" name="email" value={formData.email} onChange={handleInputChange} placeholder="hello@example.com" className="w-full px-6 py-4 bg-stone-50 rounded-2xl border-2 border-transparent focus:border-indigo-300 focus:bg-white outline-none transition font-medium" /></div>
                                                <div><label className="block text-xs font-bold uppercase tracking-wider text-stone-400 mb-1 ml-1">Phone</label><input type="tel" name="phone" value={formData.phone} onChange={handleInputChange} placeholder="99999 99999" className="w-full px-6 py-4 bg-stone-50 rounded-2xl border-2 border-transparent focus:border-indigo-300 focus:bg-white outline-none transition font-medium" /></div>
                                            </div>
                                        </div>
                                        <div className="pt-6 mt-6 border-t border-dashed border-stone-200">
                                            {queue.length > 0 && <div className="text-center mb-4 text-xs font-medium text-amber-600 bg-amber-50 inline-block px-4 py-1 rounded-full mx-auto w-full animate-pulse">Hold on, just syncing with the server...</div>}
                                            <button type="submit" disabled={!isFormValid || submitStatus === 'sending'} className={`w-full py-4 rounded-2xl font-bold text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all flex items-center justify-center gap-2 ${isFormValid ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white cursor-pointer' : 'bg-stone-200 text-stone-400 cursor-not-allowed'}`}>
                                                {submitStatus === 'sending' ? 'Registering...' : 'Complete Registration'}
                                                {submitStatus !== 'sending' && <span className={isFormValid ? 'opacity-100' : 'opacity-0'}><Icons.CheckCircle /></span>}
                                            </button>
                                            {!isFormValid && <p className="text-center text-xs text-stone-400 mt-3">* Please fill all fields to continue</p>}
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>
                    
                    {/* FOOTER */}
                    <footer className="bg-white border-t border-stone-100 py-16 mt-20">
                        <div className="max-w-7xl mx-auto px-4 text-center md:text-left grid md:grid-cols-4 gap-12 text-stone-500">
                            <div className="md:col-span-2 space-y-4">
                                <h5 className="text-stone-900 font-serif font-bold text-2xl">Shankarrao Chavan <br/>Law College</h5>
                                <p className="text-sm leading-relaxed max-w-sm">Organized by the Cell for Human Rights Activities (CHRA). Believing in the welfare of masses and the power of individual voices.</p>
                            </div>
                            <div>
                                <h5 className="text-stone-900 font-bold mb-6">Get in Touch</h5>
                                <div className="space-y-3 text-sm">
                                    <div className="flex items-center justify-center md:justify-start gap-3"><span className="text-stone-300"><Icons.Phone /></span> +91 020-12345678</div>
                                    <div className="flex items-center justify-center md:justify-start gap-3"><span className="text-stone-300"><Icons.Mail /></span> chra@sclc.edu.in</div>
                                    <div className="flex items-center justify-center md:justify-start gap-3"><span className="text-stone-300"><Icons.MapPin /></span> Pune, Maharashtra</div>
                                </div>
                            </div>
                            <div>
                                <h5 className="text-stone-900 font-bold mb-6">Links</h5>
                                <ul className="text-sm space-y-3">
                                    <li><a href="#" className="hover:text-rose-500 transition">Download Rule Book</a></li>
                                    <li><a href="#" className="hover:text-rose-500 transition">Official Website</a></li>
                                </ul>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto px-4 mt-16 pt-8 border-t border-stone-100 text-center text-xs text-stone-400">&copy; 2026 CHRA. Designed with <span className="inline text-rose-400 mx-1"><Icons.Heart width={12} /></span> for the students.</div>
                    </footer>
                    
                    {/* CONFIRM MODAL */}
                    <Modal isOpen={showConfirmModal} onClose={() => setShowConfirmModal(false)} title="Check Details" colorClass="bg-[#2D3142]" footer={
                        <>
                            <button onClick={() => setShowConfirmModal(false)} className="px-6 py-3 text-stone-600 hover:bg-stone-200 rounded-xl font-bold transition">Back</button>
                            <button onClick={confirmSubmit} className="px-8 py-3 bg-[#EF8354] text-white rounded-xl font-bold hover:bg-[#D96C3E] shadow-lg shadow-orange-200 transition transform hover:-translate-y-0.5">Yes, Submit</button>
                        </>
                    }>
                        <div className="space-y-2">
                            <p className="text-stone-500 mb-6 text-lg">Just making sure we got everything right:</p>
                            <div className="bg-stone-50 p-6 rounded-2xl space-y-4 text-stone-700 border border-stone-100">
                                <div className="grid grid-cols-[80px_1fr] items-center gap-4"><span className="text-xs font-bold uppercase tracking-wider text-stone-400">Who</span><span className="font-serif text-lg font-bold">{formData.name}</span></div>
                                <div className="grid grid-cols-[80px_1fr] items-center gap-4"><span className="text-xs font-bold uppercase tracking-wider text-stone-400">Where</span><span className="font-medium">{formData.classStr}</span></div>
                                <div className="grid grid-cols-[80px_1fr] items-center gap-4"><span className="text-xs font-bold uppercase tracking-wider text-stone-400">What</span><span className="font-bold text-rose-600 bg-rose-50 px-3 py-1 rounded-full inline-block w-fit">{formData.event}</span></div>
                                <div className="h-px bg-stone-200 my-2"></div>
                                <div className="grid grid-cols-[80px_1fr] items-center gap-4 text-sm text-stone-500"><span className="text-xs font-bold uppercase tracking-wider text-stone-400">Contact</span><span>{formData.email}<br/>{formData.phone}</span></div>
                            </div>
                        </div>
                    </Modal>

                    {/* SUCCESS MODAL */}
                    <Modal isOpen={showSuccessModal} onClose={() => setShowSuccessModal(false)} title="Welcome Aboard!" colorClass="bg-emerald-600" footer={
                        <button onClick={() => setShowSuccessModal(false)} className="px-8 py-3 bg-stone-900 text-white rounded-xl font-bold hover:bg-black shadow-lg transition w-full">Great, Thanks!</button>
                    }>
                        <div className="text-center py-6">
                            <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6"><Icons.Sparkles width={40} height={40} /></div>
                            <h4 className="text-2xl font-serif font-bold text-stone-800 mb-3">You are registered.</h4>
                            <p className="text-stone-500 leading-relaxed max-w-xs mx-auto">Your details are safe with us. We look forward to seeing your contribution to the Human Rights Week.</p>
                        </div>
                    </Modal>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
