<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Rights Week | CHRA</title>
    
    <!-- 1. STYLES: TailwindCSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- 2. CORE LIBRARIES: React, ReactDOM, Babel (Stable Versions) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
    
    <!-- 3. ICONS: Lucide (Loaded globally for safety) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Base Design Tokens */
        :root {
            --paper: #FDFBF7;
            --ink: #2D3142;
            --accent-1: #EF8354; /* Orange */
            --accent-2: #4F5D75; /* Blue Grey */
        }
        
        body { 
            font-family: 'DM Sans', sans-serif; 
            background-color: var(--paper);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }
        
        h1, h2, h3, .font-serif { 
            font-family: 'DM Serif Display', serif; 
        }

        /* Smooth Animations */
        .animate-fade-up { animation: fadeUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #EF8354;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- ROOT CONTAINER -->
    <div id="root">
        <!-- Fallback Loading State (Visible until React takes over) -->
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div class="loader" style="width: 40px; height: 40px; border-width: 4px;"></div>
            <p style="margin-top: 20px; color: #666; font-family: sans-serif;">Loading Human Rights Week...</p>
        </div>
    </div>

    <!-- REACT APPLICATION LOGIC -->
    <script type="text/babel">
        
        // --- CONFIGURATION ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybYIz6ku_y3xECIikcrO97_T6cR0uK8BpRUSio0FzN2T0CMgxlANSq0y1TmIjtACnagQ/exec";

        // --- ICONS (SVG Components for reliability) ---
        const Icons = {
            Pen: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>,
            Camera: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
            Mic: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            MapPin: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            ArrowRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        };

        const { useState, useEffect } = React;

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [view, setView] = useState('home'); // home, events, register
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            
            // Registration State
            const [formData, setFormData] = useState({
                name: '',
                classStr: '',
                event: '',
                email: '',
                phone: ''
            });
            const [status, setStatus] = useState('idle'); // idle, submitting, success, error
            const [queue, setQueue] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [showConfirm, setShowConfirm] = useState(false);

            // --- EVENT DATA (From PDF) ---
            const events = [
                {
                    id: 1,
                    title: "Poster Making",
                    subtitle: "Art for Rights",
                    date: "13th Jan",
                    time: "9:00 AM - 10:30 AM",
                    venue: "Classroom 405",
                    icon: <Icons.Pen />,
                    color: "bg-emerald-50 text-emerald-700 border-emerald-100",
                    btnColor: "bg-emerald-600 hover:bg-emerald-700",
                    desc: "Express your vision of human rights. Themes: Privacy, Equality, Child Labour, Free Speech. (Individual or Team of 2)."
                },
                {
                    id: 2,
                    title: "Stories Through Lens",
                    subtitle: "Photography Contest",
                    date: "13th Jan",
                    time: "12:00 PM Onwards",
                    venue: "Classroom 501",
                    icon: <Icons.Camera />,
                    color: "bg-blue-50 text-blue-700 border-blue-100",
                    btnColor: "bg-blue-600 hover:bg-blue-700",
                    desc: "Capture the untold stories. Max 5 photos per story. Submission deadline: 12th Jan, 10:00 AM.",
                    link: "https://docs.google.com/forms/..."
                },
                {
                    id: 3,
                    title: "Open Mic",
                    subtitle: "Speak Your Truth",
                    date: "14th Jan",
                    time: "12:00 PM Onwards",
                    venue: "Classroom 501",
                    icon: <Icons.Mic />,
                    color: "bg-rose-50 text-rose-700 border-rose-100",
                    btnColor: "bg-rose-600 hover:bg-rose-700",
                    desc: "Perform Music, Speech, Dance, or Poetry (5-7 mins). Themes: Privacy, Equality, Mental Health."
                }
            ];

            // --- QUEUE PROCESSOR (Google Sheet Sync) ---
            useEffect(() => {
                if (queue.length === 0 || isProcessing) return;

                const processItem = async () => {
                    setIsProcessing(true);
                    setStatus('submitting');
                    
                    const payload = queue[0];
                    
                    try {
                        if (SCRIPT_URL.includes("PASTE_YOUR")) {
                            // Simulator for dev/testing
                            console.warn("Using Simulator (No URL Set)");
                            await new Promise(r => setTimeout(r, 2000)); 
                        } else {
                            // Actual Request
                            await fetch(SCRIPT_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                        }
                        
                        setStatus('success');
                        setQueue(prev => prev.slice(1));
                        setFormData({ name: '', classStr: '', event: '', email: '', phone: '' }); // Reset
                    } catch (err) {
                        console.error(err);
                        setStatus('error');
                        setQueue(prev => prev.slice(1));
                    } finally {
                        setIsProcessing(false);
                    }
                };
                processItem();
            }, [queue, isProcessing]);

            // --- HANDLERS ---
            const handleInput = (e) => setFormData({...formData, [e.target.name]: e.target.value});
            const isFormValid = Object.values(formData).every(v => v.trim().length > 0);
            
            const handlePreSubmit = (e) => {
                e.preventDefault();
                if (isFormValid) setShowConfirm(true);
            };

            const handleFinalSubmit = () => {
                setShowConfirm(false);
                setQueue(prev => [...prev, { ...formData, timestamp: new Date().toISOString() }]);
            };

            // --- UI HELPERS ---
            const NavButton = ({ target, label, highlight }) => (
                <button 
                    onClick={() => { setView(target); setIsMenuOpen(false); window.scrollTo(0,0); }}
                    className={`px-6 py-2 rounded-full font-medium transition-all ${
                        view === target 
                        ? 'bg-white text-black shadow-sm' 
                        : highlight 
                            ? 'bg-black text-white hover:bg-gray-800'
                            : 'text-gray-500 hover:text-black'
                    }`}
                >
                    {label}
                </button>
            );

            return (
                <div className="min-h-screen pb-20">
                    
                    {/* NAVIGATION */}
                    <nav className="sticky top-4 z-50 px-4 mb-12">
                        <div className="max-w-5xl mx-auto bg-white/80 backdrop-blur-md border border-gray-200 rounded-full shadow-sm p-2 flex justify-between items-center pl-6">
                            <div className="flex items-center gap-3" onClick={() => setView('home')}>
                                <div className="w-8 h-8 bg-gradient-to-br from-orange-400 to-rose-500 rounded-full flex items-center justify-center text-white font-serif font-bold cursor-pointer">C</div>
                                <div className="hidden sm:block leading-none cursor-pointer">
                                    <h1 className="text-sm font-bold text-gray-900">SCLC Pune</h1>
                                    <span className="text-[10px] text-gray-500 tracking-wider font-bold uppercase">Human Rights Week</span>
                                </div>
                            </div>
                            
                            {/* Desktop Nav */}
                            <div className="hidden md:flex gap-1 bg-gray-100/50 p-1 rounded-full">
                                <NavButton target="home" label="Home" />
                                <NavButton target="events" label="Schedule" />
                                <NavButton target="register" label="Register" highlight />
                            </div>

                            {/* Mobile Menu Toggle */}
                            <button className="md:hidden p-3 text-gray-600" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                {isMenuOpen ? <Icons.Close /> : <Icons.Menu />}
                            </button>
                        </div>

                        {/* Mobile Menu Dropdown */}
                        {isMenuOpen && (
                            <div className="absolute top-20 left-4 right-4 bg-white rounded-2xl shadow-xl border border-gray-100 p-4 flex flex-col gap-2 z-50 animate-fade-up">
                                <button onClick={() => {setView('home'); setIsMenuOpen(false)}} className="p-4 text-left font-medium hover:bg-gray-50 rounded-xl">Home</button>
                                <button onClick={() => {setView('events'); setIsMenuOpen(false)}} className="p-4 text-left font-medium hover:bg-gray-50 rounded-xl">Schedule</button>
                                <button onClick={() => {setView('register'); setIsMenuOpen(false)}} className="p-4 text-left font-bold text-white bg-black rounded-xl">Register Now</button>
                            </div>
                        )}
                    </nav>

                    {/* MAIN CONTENT SWITCHER */}
                    <main className="max-w-5xl mx-auto px-4">
                        
                        {/* 1. HOME VIEW */}
                        {view === 'home' && (
                            <div className="space-y-16 animate-fade-up">
                                {/* Hero */}
                                <div className="relative bg-[#2D3142] text-white rounded-[2.5rem] p-8 md:p-20 overflow-hidden min-h-[500px] flex items-center">
                                    {/* Abstract Background Shapes */}
                                    <div className="absolute top-[-20%] right-[-10%] w-[400px] h-[400px] bg-[#EF8354] rounded-full blur-[80px] opacity-30"></div>
                                    <div className="absolute bottom-[-10%] left-[-10%] w-[300px] h-[300px] bg-[#4F5D75] rounded-full blur-[60px] opacity-40"></div>
                                    
                                    <div className="relative z-10 max-w-2xl space-y-8">
                                        <div className="inline-flex items-center gap-2 px-4 py-2 bg-white/10 rounded-full text-orange-100 text-sm font-medium border border-white/10">
                                            <Icons.Calendar /> 13th & 14th January 2026
                                        </div>
                                        <h1 className="text-5xl md:text-7xl leading-[1.1]">
                                            Welfare of <br />
                                            <span className="text-[#EF8354]">Masses.</span>
                                        </h1>
                                        <p className="text-xl text-gray-300 font-light leading-relaxed">
                                            Join the Cell for Human Rights Activities (CHRA) for two days of art, photography, and voices that matter.
                                        </p>
                                        <div className="flex flex-wrap gap-4 pt-4">
                                            <button onClick={() => setView('register')} className="px-8 py-4 bg-white text-black rounded-full font-bold hover:bg-orange-50 transition transform hover:-translate-y-1">
                                                Participate
                                            </button>
                                            <button onClick={() => setView('events')} className="px-8 py-4 border border-white/30 rounded-full font-bold hover:bg-white/10 transition">
                                                View Schedule
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Info Grid */}
                                <div className="grid md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm flex items-center gap-4">
                                        <div className="p-3 bg-orange-50 text-orange-600 rounded-2xl"><Icons.Calendar /></div>
                                        <div>
                                            <h3 className="text-lg font-bold">Jan 13-14</h3>
                                            <p className="text-gray-500 text-sm">Two Days</p>
                                        </div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm flex items-center gap-4">
                                        <div className="p-3 bg-blue-50 text-blue-600 rounded-2xl"><Icons.MapPin /></div>
                                        <div>
                                            <h3 className="text-lg font-bold">Campus</h3>
                                            <p className="text-gray-500 text-sm">Classroom 405 & 501</p>
                                        </div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm flex items-center gap-4">
                                        <div className="p-3 bg-emerald-50 text-emerald-600 rounded-2xl"><Icons.Check /></div>
                                        <div>
                                            <h3 className="text-lg font-bold">Open to All</h3>
                                            <p className="text-gray-500 text-sm">Register to Join</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. EVENTS VIEW */}
                        {(view === 'events' || view === 'home') && (
                            <div className={`mt-20 ${view === 'events' ? 'animate-fade-up' : ''}`}>
                                <div className="text-center mb-12">
                                    <h2 className="text-4xl mb-4">Event Schedule</h2>
                                    <p className="text-gray-500">Every voice counts. Find your stage.</p>
                                </div>

                                <div className="grid md:grid-cols-3 gap-6">
                                    {events.map((ev, i) => (
                                        <div key={ev.id} className={`group bg-white p-6 rounded-[2rem] border-2 ${ev.color} transition-all duration-300 hover:-translate-y-2 hover:shadow-xl flex flex-col h-full`}>
                                            <div className="flex justify-between items-start mb-6">
                                                <div className="bg-white/50 backdrop-blur px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider">
                                                    {ev.date}
                                                </div>
                                                <div className="p-3 bg-white rounded-2xl shadow-sm">{ev.icon}</div>
                                            </div>
                                            
                                            <h3 className="text-2xl font-bold mb-1">{ev.title}</h3>
                                            <p className="font-medium opacity-80 mb-4">{ev.subtitle}</p>
                                            
                                            <div className="space-y-2 text-sm opacity-70 mb-6 bg-white/50 p-4 rounded-xl">
                                                <div className="flex items-center gap-2"><Icons.Clock /> {ev.time}</div>
                                                <div className="flex items-center gap-2"><Icons.MapPin /> {ev.venue}</div>
                                            </div>
                                            
                                            <p className="text-sm leading-relaxed opacity-80 mb-6 flex-grow">{ev.desc}</p>
                                            
                                            <button 
                                                onClick={() => { setFormData(prev => ({...prev, event: ev.title})); setView('register'); window.scrollTo(0,0); }}
                                                className={`w-full py-4 rounded-xl text-white font-bold flex items-center justify-center gap-2 ${ev.btnColor}`}
                                            >
                                                Register <Icons.ArrowRight />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 3. REGISTER VIEW */}
                        {view === 'register' && (
                            <div className="animate-fade-up max-w-xl mx-auto mt-10">
                                <div className="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-xl border border-gray-100 relative overflow-hidden">
                                    {/* Paper texture overlay effect */}
                                    <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-orange-400 to-rose-500"></div>
                                    
                                    <div className="text-center mb-10">
                                        <h2 className="text-3xl mb-2">Secure Your Spot</h2>
                                        <p className="text-gray-500">Please fill the form below to participate.</p>
                                    </div>

                                    {status === 'success' ? (
                                        <div className="text-center py-12 animate-fade-up">
                                            <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                                                <Icons.Check />
                                            </div>
                                            <h3 className="text-2xl font-bold mb-2">Registered Successfully!</h3>
                                            <p className="text-gray-500 mb-8">We've received your details. See you there!</p>
                                            <button onClick={() => setStatus('idle')} className="text-black font-bold underline">Register another student</button>
                                        </div>
                                    ) : (
                                        <form onSubmit={handlePreSubmit} className="space-y-5">
                                            <div className="space-y-1">
                                                <label className="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Select Event</label>
                                                <select 
                                                    name="event" 
                                                    value={formData.event} 
                                                    onChange={handleInput} 
                                                    className="w-full p-4 bg-gray-50 rounded-xl font-medium border-2 border-transparent focus:bg-white focus:border-black outline-none transition"
                                                >
                                                    <option value="">-- Choose --</option>
                                                    {events.map(e => <option key={e.id} value={e.title}>{e.title}</option>)}
                                                </select>
                                            </div>

                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1">
                                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Full Name</label>
                                                    <input type="text" name="name" value={formData.name} onChange={handleInput} placeholder="e.g. Aditi Rao" className="w-full p-4 bg-gray-50 rounded-xl font-medium border-2 border-transparent focus:bg-white focus:border-black outline-none transition" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Class</label>
                                                    <input type="text" name="classStr" value={formData.classStr} onChange={handleInput} placeholder="e.g. LL.B II" className="w-full p-4 bg-gray-50 rounded-xl font-medium border-2 border-transparent focus:bg-white focus:border-black outline-none transition" />
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1">
                                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Email</label>
                                                    <input type="email" name="email" value={formData.email} onChange={handleInput} placeholder="hello@..." className="w-full p-4 bg-gray-50 rounded-xl font-medium border-2 border-transparent focus:bg-white focus:border-black outline-none transition" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Phone</label>
                                                    <input type="tel" name="phone" value={formData.phone} onChange={handleInput} placeholder="999..." className="w-full p-4 bg-gray-50 rounded-xl font-medium border-2 border-transparent focus:bg-white focus:border-black outline-none transition" />
                                                </div>
                                            </div>

                                            <button 
                                                type="submit" 
                                                disabled={!isFormValid || status === 'submitting'}
                                                className={`w-full py-4 mt-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all ${
                                                    isFormValid 
                                                    ? 'bg-black text-white hover:bg-gray-800 shadow-lg' 
                                                    : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                                }`}
                                            >
                                                {status === 'submitting' ? <div className="loader border-t-white"></div> : 'Complete Registration'}
                                            </button>
                                        </form>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* CONFIRMATION MODAL */}
                    {showConfirm && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 animate-fade-up">
                            <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl">
                                <h3 className="text-xl font-bold mb-4">Confirm Details</h3>
                                <div className="bg-gray-50 p-4 rounded-xl space-y-2 mb-6 text-sm">
                                    <p><span className="text-gray-500 font-bold uppercase text-xs">Name:</span> <br/>{formData.name}</p>
                                    <p><span className="text-gray-500 font-bold uppercase text-xs">Event:</span> <br/>{formData.event}</p>
                                    <p><span className="text-gray-500 font-bold uppercase text-xs">Contact:</span> <br/>{formData.email}</p>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowConfirm(false)} className="flex-1 py-3 font-bold text-gray-500 hover:bg-gray-100 rounded-xl">Back</button>
                                    <button onClick={handleFinalSubmit} className="flex-1 py-3 font-bold bg-black text-white rounded-xl hover:bg-gray-800">Submit</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="mt-24 text-center text-gray-400 text-sm py-8 border-t border-gray-200">
                        &copy; 2026 Cell for Human Rights Activities (CHRA).
                    </footer>
                </div>
            );
        };

        // --- ERROR BOUNDARY (Prevent White Screen of Death) ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-10 text-center font-sans">
                            <h1 className="text-2xl font-bold text-red-600 mb-4">Something went wrong.</h1>
                            <p className="text-gray-600 mb-4">Please refresh the page.</p>
                            <pre className="bg-gray-100 p-4 rounded text-left text-xs overflow-auto">{this.state.error.toString()}</pre>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- RENDER ---
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(
                <ErrorBoundary>
                    <App />
                </ErrorBoundary>
            );
        } catch (e) {
            document.body.innerHTML = '<div style="padding:20px; color:red"><h2>Critical Error: React failed to load.</h2><p>Check your internet connection or CDN settings.</p></div>';
            console.error(e);
        }

    </script>
</body>
</html>
